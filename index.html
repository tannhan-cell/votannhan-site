<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Hệ thống quản lý huyết áp</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background: #f4f6f9;
    }
    .card {
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .sidebar {
      height: 100vh;
      background: #2c3e50;
      color: white;
      padding: 20px;
    }
    .sidebar h3 {
      color: #1abc9c;
    }
    .patient-item {
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
    }
    .patient-item:hover {
      background: #ecf0f1;
      color: black;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="container mt-5 text-center">
  <div class="card p-4">
    <h3>🔐 Đăng nhập hệ thống</h3>
    <input type="password" id="password" class="form-control my-3" placeholder="Nhập mật khẩu admin">
    <button class="btn btn-primary" onclick="login()">Đăng nhập</button>
  </div>
</div>

<!-- MAIN -->
<div id="mainPage" style="display:none;">
  <div class="row">

    <!-- Sidebar -->
    <div class="col-3 sidebar">
      <h3>🩺 Patients</h3>
      <ul id="patientList" class="list-unstyled"></ul>
    </div>

    <!-- Content -->
    <div class="col-9 p-4">

      <h2>📊 Dashboard</h2>

      <!-- Add patient -->
      <div class="card p-3 mb-3">
        <h5>➕ Thêm bệnh nhân</h5>
        <div class="row">
          <div class="col"><input id="name" class="form-control" placeholder="Tên"></div>
          <div class="col"><input id="dob" class="form-control" placeholder="Ngày sinh"></div>
          <div class="col"><input id="cccd" class="form-control" placeholder="CCCD"></div>
          <div class="col"><input id="address" class="form-control" placeholder="Địa chỉ"></div>
        </div>
        <button class="btn btn-success mt-2" onclick="addPatient()">Lưu</button>
      </div>

      <!-- Info -->
      <div class="card p-3 mb-3">
        <h5 id="patientName">Chưa chọn bệnh nhân</h5>
        <p id="patientInfo"></p>
      </div>

      <!-- Chart -->
      <div class="card p-3">
        <canvas id="chart"></canvas>
      </div>

    </div>
  </div>
</div>

<script>
let currentPatient = null;
let chart = null;

async function login(){
  let pass = document.getElementById("password").value;

  if(pass === "admin123"){
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("mainPage").style.display = "block";
    loadPatients();
  }else{
    alert("Sai mật khẩu!");
  }
}

async function addPatient(){
  let p = {
    name: name.value,
    dob: dob.value,
    cccd: cccd.value,
    address: address.value
  };

  await fetch("http://localhost:3000/patient",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(p)
  });

  loadPatients();
}

async function loadPatients(){
  let res = await fetch("http://localhost:3000/patient");
  let data = await res.json();

  let list = document.getElementById("patientList");
  list.innerHTML = "";

  data.forEach(p=>{
    let li = document.createElement("li");
    li.className = "patient-item";
    li.innerText = p.name;
    li.onclick = ()=>selectPatient(p);
    list.appendChild(li);
  });
}

function selectPatient(p){
  currentPatient = p;

  document.getElementById("patientName").innerText = p.name;
  document.getElementById("patientInfo").innerText =
    `CCCD: ${p.cccd} | DOB: ${p.dob} | Address: ${p.address}`;

  drawChart(p);
}

function drawChart(p){
  let ctx = document.getElementById("chart");

  if(chart) chart.destroy();

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: p.records.map(r=>r.time),
      datasets: [
        {
          label: 'SYS',
          data: p.records.map(r=>r.sys),
          borderColor: 'red'
        },
        {
          label: 'DIA',
          data: p.records.map(r=>r.dia),
          borderColor: 'blue'
        },
        {
          label: 'HR',
          data: p.records.map(r=>r.hr),
          borderColor: 'green'
        }
      ]
    }
  });
}
</script>

</body>
</html>
