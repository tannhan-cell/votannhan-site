<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>ICU System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
body{background:#020617;color:white;}
.card{background:#0f172a;border:none;border-radius:15px;}
.sidebar{height:100vh;background:#020617;padding:15px;border-right:1px solid #1e293b;}
.patient{cursor:pointer;padding:8px;}
.patient:hover{background:#1e293b;}
.big{font-size:40px;font-weight:bold;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="container mt-5 text-center">
  <h2>🔐 Admin Login</h2>
  <input id="pass" type="password" class="form-control my-3" placeholder="Password">
  <button class="btn btn-success" onclick="login()">Login</button>
</div>

<!-- MAIN -->
<div id="main" style="display:none;">
<div class="row">

<!-- SIDEBAR -->
<div class="col-3 sidebar">
  <h4>🩺 Patients</h4>
  <ul id="patients"></ul>
</div>

<!-- CONTENT -->
<div class="col-9 p-3">

<!-- ADD PATIENT -->
<div class="card p-3 mb-3">
  <h5>➕ Tạo hồ sơ</h5>
  <div class="row">
    <div class="col"><input id="name" class="form-control" placeholder="Tên"></div>
    <div class="col"><input id="dob" class="form-control" placeholder="Ngày sinh"></div>
    <div class="col"><input id="cccd" class="form-control" placeholder="CCCD"></div>
    <div class="col"><input id="address" class="form-control" placeholder="Địa chỉ"></div>
  </div>
  <button class="btn btn-success mt-2" onclick="addPatient()">Tạo</button>
</div>

<!-- INFO -->
<div class="card p-3 mb-3">
  <h5 id="pname">Chưa chọn bệnh nhân</h5>
  <div id="pinfo"></div>
</div>

<!-- MEASUREMENTS LIST -->
<div class="card p-3 mb-3">
  <h5>📁 Lịch sử đo</h5>
  <ul id="records"></ul>
</div>

<!-- ICU DISPLAY -->
<div id="monitor" style="display:none;">
<div class="row">

<div class="col-4">
  <div class="card p-3 text-center">
    SYS <div id="sys" class="big text-success">--</div>
  </div>
</div>

<div class="col-4">
  <div class="card p-3 text-center">
    DIA <div id="dia" class="big text-warning">--</div>
  </div>
</div>

<div class="col-4">
  <div class="card p-3 text-center">
    HR <div id="hr" class="big text-danger">--</div>
  </div>
</div>

</div>

<div class="card p-3 mt-3">
  <canvas id="chart"></canvas>
</div>
</div>

</div>
</div>
</div>

<script>

let currentPatient = null;
let currentRecords = [];
let chart;

// LOGIN
function login(){
  if(pass.value==="admin123"){
    localStorage.setItem("login","true");
    location.reload();
  }else alert("Sai mật khẩu");
}

window.onload = ()=>{
  if(localStorage.getItem("login")==="true"){
    login.style.display="none";
    main.style.display="block";
    loadPatients();
  }
}

// LOAD PATIENT
async function loadPatients(){
  let res = await fetch("http://localhost:3000/patient");
  let data = await res.json();

  let list = document.getElementById("patients");
  list.innerHTML="";

  data.forEach(p=>{
    let li=document.createElement("li");
    li.className="patient";
    li.innerText=p.name;
    li.onclick=()=>selectPatient(p);
    list.appendChild(li);
  });
}

// ADD PATIENT
async function addPatient(){
  let p={
    name:name.value,
    dob:dob.value,
    cccd:cccd.value,
    address:address.value
  };

  await fetch("http://localhost:3000/patient",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(p)
  });

  loadPatients();
}

// SELECT PATIENT
function selectPatient(p){
  currentPatient=p;

  pname.innerText=p.name;
  pinfo.innerText=`CCCD: ${p.cccd} | DOB: ${p.dob}`;

  loadRecords(p);
}

// LOAD RECORDS
function loadRecords(p){
  let list=document.getElementById("records");
  list.innerHTML="";

  currentRecords = p.records || [];

  currentRecords.forEach(r=>{
    let li=document.createElement("li");
    li.className="patient";
    li.innerText=r.time; // file name kiểu ngày giờ
    li.onclick=()=>showRecord(r);
    list.appendChild(li);
  });
}

// SHOW SINGLE RECORD
function showRecord(r){
  monitor.style.display="block";

  sys.innerText=r.sys;
  dia.innerText=r.dia;
  hr.innerText=r.hr;

  drawChart([r]); // chỉ 1 lần đo
}

// DRAW CHART
function drawChart(records){
  let ctx=document.getElementById("chart");

  if(chart) chart.destroy();

  chart=new Chart(ctx,{
    type:"line",
    data:{
      labels:records.map(r=>r.time),
      datasets:[
        {label:"SYS",data:records.map(r=>r.sys),borderColor:"green"},
        {label:"DIA",data:records.map(r=>r.dia),borderColor:"yellow"},
        {label:"HR",data:records.map(r=>r.hr),borderColor:"red"}
      ]
    }
  });
}

// REALTIME
const socket = io("http://localhost:3000");

socket.on("newData",(msg)=>{
  if(!currentPatient) return;
  if(msg.cccd!==currentPatient.cccd) return;

  currentPatient.records.push(msg.data);
  loadRecords(currentPatient);

  showRecord(msg.data); // tự nhảy realtime
});

</script>

</body>
</html>
