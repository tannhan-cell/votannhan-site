<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Medical Admin</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{font-family:sans-serif;background:#0f172a;color:white;text-align:center;}
.card{background:#1e293b;padding:20px;margin:10px;border-radius:10px;}
button{padding:10px;margin:5px;border:none;background:#3b82f6;color:white;}
</style>

</head>

<body>

<h1>🏥 Medical Dashboard</h1>

<div class="card">
SYS: <span id="sys">--</span><br>
DIA: <span id="dia">--</span><br>
HR: <span id="hr">--</span>
</div>

<canvas id="chart"></canvas>

<h2>Users</h2>
<div id="users"></div>

<script>

const API="http://YOUR_ESP32_IP";

let chart=new Chart(document.getElementById("chart"),{
  type:"line",
  data:{labels:[],datasets:[{label:"SYS",data:[]}]}
});

setInterval(()=>{
  fetch(API+"/data")
  .then(r=>r.json())
  .then(d=>{
    sys.innerText=d.sys;
    dia.innerText=d.dia;
    hr.innerText=d.hr;

    chart.data.labels.push(new Date().toLocaleTimeString());
    chart.data.datasets[0].data.push(d.sys);

    if(chart.data.labels.length>10){
      chart.data.labels.shift();
      chart.data.datasets[0].data.shift();
    }

    chart.update();
  });
},2000);

fetch(API+"/users")
.then(r=>r.json())
.then(u=>{
  users.innerHTML="";
  u.forEach(x=>{
    users.innerHTML+=`<div>${x.name}</div>`;
  });
});

</script>

</body>
</html>
