<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hệ thống đo huyết áp</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin:0;
    font-family:Segoe UI;
    display:flex;
    height:100vh;
    background:#f1f2f6;
}

/* sidebar */
#sidebar {
    width:270px;
    background:#2f3542;
    color:white;
    padding:15px;
}

.patient {
    padding:10px;
    margin:6px 0;
    background:#57606f;
    border-radius:6px;
    cursor:pointer;
}

.patient:hover {
    background:#1e90ff;
}

/* main */
#main {
    flex:1;
    padding:20px;
}

.card {
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

input {
    padding:8px;
    margin:5px;
    width:180px;
}

button {
    padding:8px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.green {background:#2ed573;color:white;}
.red {background:#ff4757;color:white;}
.orange {background:#ffa502;color:white;}

.stat {
    display:inline-block;
    margin-right:20px;
    font-size:18px;
}
</style>
</head>

<body>

<div id="sidebar">
    <h3>Bệnh nhân</h3>
    <div id="list"></div>
</div>

<div id="main">

<div class="card">
    <h3>Tạo hồ sơ</h3>
    <input id="name" placeholder="Tên">
    <input id="dob" placeholder="Ngày sinh">
    <input id="cccd" placeholder="CCCD">
    <input id="addr" placeholder="Địa chỉ"><br>
    <button class="green" onclick="create()">Tạo hồ sơ</button>
</div>

<div class="card">
    <h3 id="info">Chưa chọn bệnh nhân</h3>

    <div id="stats"></div><br>

    <button class="orange" onclick="startMeasure()">BẮT ĐẦU ĐO</button>
    <button class="red" onclick="deletePatient()">Xóa</button>
</div>

<div class="card">
    <canvas id="chart"></canvas>
</div>

</div>

<script>
const API="http://127.0.0.1:5000"
let current=null
let chart=null

function load(){
 fetch(API+"/patients")
 .then(r=>r.json())
 .then(data=>{
    list.innerHTML=""
    data.forEach(f=>{
        let d=document.createElement("div")
        d.className="patient"
        d.innerText=f
        d.onclick=()=>openFolder(f)
        list.appendChild(d)
    })
 })
}

function create(){
 fetch(API+"/create_patient",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
        name:name.value,
        dob:dob.value,
        cccd:cccd.value,
        addr:addr.value
    })
 }).then(()=>{
    alert("Tạo thành công")
    load()
 })
}

function openFolder(f){
 current=f
 info.innerHTML="👤 "+f
 update()
}

function update(){
 if(!current) return

 fetch(API+"/records/"+current)
 .then(r=>r.json())
 .then(data=>{

    if(data.length==0) return

    let sys=data.map(x=>x.sys)
    let dia=data.map(x=>x.dia)
    let pulse=data.map(x=>x.pulse)

    let avg=(arr)=>Math.round(arr.reduce((a,b)=>a+b,0)/arr.length)

    stats.innerHTML=`
    <div class="stat">SYS TB: ${avg(sys)}</div>
    <div class="stat">DIA TB: ${avg(dia)}</div>
    <div class="stat">PULSE TB: ${avg(pulse)}</div>
    `

    if(chart) chart.destroy()

    chart=new Chart(chartCanvas,{
        type:"line",
        data:{
            labels:data.map(x=>x.time),
            datasets:[
                {label:"SYS",data:sys,borderColor:"red"},
                {label:"DIA",data:dia,borderColor:"blue"},
                {label:"PULSE",data:pulse,borderColor:"green"}
            ]
        }
    })
 })
}

function startMeasure(){
 if(!current) return alert("Chọn bệnh nhân")
 fetch(API+"/start_measure/"+current)
}

function deletePatient(){
 if(!current) return
 fetch(API+"/delete/"+current,{method:"DELETE"})
 .then(()=>{current=null; load()})
}

setInterval(update,3000)

load()
</script>

</body>
</html>
