<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Quản Lý ICU</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; }
        body { background: var(--bg); color: #fff; font-family: system-ui; margin: 0; display: flex; height: 100vh; }
        #login-screen { width: 100%; display: flex; justify-content: center; align-items: center; background: var(--bg); position: fixed; z-index: 100; height: 100%; }
        .sidebar { width: 300px; background: var(--card); border-right: 1px solid #334155; overflow-y: auto; padding: 20px; }
        .main { flex: 1; padding: 30px; overflow-y: auto; }
        .user-item { padding: 12px; background: #334155; margin-bottom: 8px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .user-item:hover { background: #475569; }
        .user-item.active { border: 2px solid var(--accent); }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #020617; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid var(--accent); }
        .stat-card h2 { color: var(--accent); margin: 10px 0; font-size: 32px; }
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; }
        th, td { padding: 15px; text-align: center; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: var(--accent); }
        .btn-edit { background: #f59e0b; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; color: #000; font-weight: bold; }
    </style>
</head>
<body>

<div id="login-screen">
    <div style="background: var(--card); padding: 40px; border-radius: 15px; text-align: center;">
        <h2>Hệ Thống ICU Admin</h2>
        <input id="u" placeholder="Admin" style="padding: 10px; margin: 5px;"><br>
        <input id="p" type="password" placeholder="Mật khẩu" style="padding: 10px; margin: 5px;"><br><br>
        <button onclick="login()" style="padding: 10px 20px; background: var(--accent); border: none; border-radius: 5px; cursor: pointer;">Đăng Nhập</button>
    </div>
</div>

<div class="sidebar">
    <h3 style="color: var(--accent)">Bệnh Nhân</h3>
    <div id="user-list"></div>
</div>

<div class="main">
    <div id="welcome-msg"><h2>Chọn một người dùng để xem lịch sử đo</h2></div>
    
    <div id="content" style="display:none">
        <h2 id="current-user-title">---</h2>
        <div class="stats">
            <div class="stat-card">AVG SYS (Tâm thu)<h2 id="avg-sys">0</h2>mmHg</div>
            <div class="stat-card">AVG DIA (Tâm trương)<h2 id="avg-dia">0</h2>mmHg</div>
            <div class="stat-card">AVG HR (Nhịp tim)<h2 id="avg-hr">0</h2>bpm</div>
        </div>

        <canvas id="chart" height="100" style="margin-bottom: 30px;"></canvas>

        <h3>Lịch Sử Đo Chi Tiết</h3>
        <table>
            <thead><tr><th>Thời gian</th><th>SYS</th><th>DIA</th><th>HR</th><th>Thiết bị</th></tr></thead>
            <tbody id="history-table"></tbody>
        </table>
    </div>
</div>

<script>
    const API = "https://doanvdk-8.onrender.com";
    let TOKEN = "";
    let selectedId = null;
    let updateInterval = null;

    const ctx = document.getElementById('chart').getContext('2d');
    let chart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [{ label: 'Huyết áp tâm thu (SYS)', data: [], borderColor: '#38bdf8', tension: 0.3 }] }
    });

    function login() {
        fetch(API+"/api/login", {
            method:"POST",
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({username: u.value, password: p.value})
        }).then(r => r.json()).then(d => {
            TOKEN = d.token;
            document.getElementById("login-screen").style.display="none";
            loadUsers();
        }).catch(() => alert("Sai thông tin!"));
    }

    function loadUsers() {
        fetch(API+"/api/users", {headers:{Authorization: TOKEN}})
        .then(r => r.json())
        .then(data => {
            document.getElementById("user-list").innerHTML = data.map(usr => `
                <div class="user-item ${selectedId == usr[0] ? 'active' : ''}" onclick="viewUser('${usr[0]}', '${usr[1]}')">
                    <span>${usr[1]}</span>
                    <button class="btn-edit" onclick="event.stopPropagation(); changeName('${usr[0]}', '${usr[1]}')">Sửa</button>
                </div>
            `).join('');
        });
    }

    function changeName(id, old) {
        let n = prompt("Đổi tên bệnh nhân:", old);
        if(n) {
            fetch(API+"/api/update_name", {
                method:"POST",
                headers:{'Content-Type':'application/json', Authorization: TOKEN},
                body: JSON.stringify({id: id, new_name: n})
            }).then(() => loadUsers());
        }
    }

    function viewUser(id, name) {
        selectedId = id;
        document.getElementById("welcome-msg").style.display = "none";
        document.getElementById("content").style.display = "block";
        document.getElementById("current-user-title").innerText = "Bệnh nhân: " + name;
        loadUsers(); 

        if(updateInterval) clearInterval(updateInterval);
        updateInterval = setInterval(fetchData, 3000);
        fetchData();
    }

    function fetchData() {
        if(!selectedId) return;
        fetch(API+`/api/history?user_id=${selectedId}`, {headers:{Authorization: TOKEN}})
        .then(r => r.json())
        .then(logs => {
            if(logs.length === 0) return;
            
            // Tính trung bình
            document.getElementById("avg-sys").innerText = (logs.reduce((a,b)=>a+b[0],0)/logs.length).toFixed(1);
            document.getElementById("avg-dia").innerText = (logs.reduce((a,b)=>a+b[1],0)/logs.length).toFixed(1);
            document.getElementById("avg-hr").innerText = (logs.reduce((a,b)=>a+b[2],0)/logs.length).toFixed(1);

            // Cập nhật bảng
            document.getElementById("history-table").innerHTML = logs.map(l => 
                `<tr><td>${l[3]}</td><td>${l[0]}</td><td>${l[1]}</td><td>${l[2]}</td><td>${l[4]}</td></tr>`
            ).join('');

            // Cập nhật biểu đồ (10 lần đo gần nhất)
            const recent = logs.slice(0, 10).reverse();
            chart.data.labels = recent.map(l => l[3].split(' ')[1]);
            chart.data.datasets[0].data = recent.map(l => l[0]);
            chart.update();
        });
    }
</script>
</body>
</html>
