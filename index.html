<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quản lý huyết áp</title>

<!-- ⚠️ NẾU BỊ BLOCK CDN → tải về local -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI';
    display: flex;
    height: 100vh;
    background: #ecf0f1;
}

#sidebar {
    width: 260px;
    background: linear-gradient(180deg, #2c3e50, #34495e);
    color: white;
    padding: 15px;
}

.patient {
    padding: 10px;
    margin: 8px 0;
    background: rgba(255,255,255,0.1);
    border-radius: 6px;
    cursor: pointer;
}

.patient:hover {
    background: #3498db;
}

#main {
    flex: 1;
    padding: 25px;
}

input {
    width: 260px;
    padding: 10px;
    margin: 6px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    padding: 10px 16px;
    border: none;
    border-radius: 6px;
    background: #2ecc71;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #27ae60;
}

#info {
    margin-top: 15px;
    padding: 10px;
    background: white;
    border-radius: 8px;
}
</style>
</head>

<body>

<div id="sidebar">
    <h3>Bệnh nhân</h3>
    <div id="list"></div>
</div>

<div id="main">

    <h2>Tạo hồ sơ</h2>

    <input id="name" placeholder="Tên">
    <input id="dob" placeholder="Ngày sinh">
    <input id="cccd" placeholder="CCCD">
    <input id="addr" placeholder="Địa chỉ"><br>

    <button onclick="createPatient()">Tạo hồ sơ</button>

    <div id="info"></div>

    <h2>Biểu đồ</h2>
    <canvas id="chart"></canvas>

</div>

<script>
const API = "http://127.0.0.1:5000"

let chart = null

function loadPatients(){
    fetch(API + "/patients")
    .then(r=>r.json())
    .then(data=>{
        list.innerHTML = ""
        data.forEach(f=>{
            let div = document.createElement("div")
            div.className = "patient"
            div.innerText = f
            div.onclick = ()=>openFolder(f)
            list.appendChild(div)
        })
    })
}

function createPatient(){
    fetch(API + "/create_patient", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            name: name.value,
            dob: dob.value,
            cccd: cccd.value,
            addr: addr.value
        })
    })
    .then(res => res.json())
    .then(data => {
        alert("Tạo thành công!")
        loadPatients()
    })
    .catch(err=>{
        alert("Lỗi kết nối server!")
        console.error(err)
    })
}

function openFolder(folder){
    fetch(API + "/records/" + folder)
    .then(r=>r.json())
    .then(data=>{

        if(data.length === 0){
            info.innerHTML = "Chưa có dữ liệu"
            return
        }

        let labels = data.map(x=>x.time)
        let sys = data.map(x=>x.sys)
        let dia = data.map(x=>x.dia)
        let pulse = data.map(x=>x.pulse)

        let avgSys = (sys.reduce((a,b)=>a+b,0)/sys.length).toFixed(1)
        let avgDia = (dia.reduce((a,b)=>a+b,0)/dia.length).toFixed(1)
        let avgPulse = (pulse.reduce((a,b)=>a+b,0)/pulse.length).toFixed(1)

        info.innerHTML = `
            <b>${folder}</b><br>
            SYS TB: ${avgSys} |
            DIA TB: ${avgDia} |
            PULSE TB: ${avgPulse}
        `

        if(chart) chart.destroy()

        chart = new Chart(document.getElementById("chart"), {
            type: "line",
            data: {
                labels: labels,
                datasets: [
                    { label: "SYS", data: sys, borderColor: "red" },
                    { label: "DIA", data: dia, borderColor: "blue" },
                    { label: "PULSE", data: pulse, borderColor: "green" }
                ]
            }
        })
    })
}

loadPatients()
</script>

</body>
</html>
