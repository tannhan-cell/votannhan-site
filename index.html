<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>ICU Monitor Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { margin: 0; background: #0f172a; color: #0ff; font-family: sans-serif; padding: 20px; }
        .center { display: flex; justify-content: center; align-items: center; height: 90vh; }
        .card-container { display: flex; gap: 15px; margin: 20px 0; }
        .card { flex: 1; background: #020617; border: 1px solid #0ff; padding: 15px; border-radius: 10px; text-align: center; }
        .big { font-size: 35px; font-weight: bold; margin: 10px 0; }
        .avg { font-size: 14px; color: #888; }
        input { padding: 10px; margin: 5px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #0ff; border: none; cursor: pointer; font-weight: bold; }
        .user-item { background: #1e293b; margin: 5px 0; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-radius: 5px; }
        .history-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .history-table th, .history-table td { border: 1px solid #334155; padding: 10px; text-align: center; }
        .history-table th { background: #1e293b; }
        canvas { background: #020617; border-radius: 10px; margin: 20px 0; }
        .edit-btn { background: #f59e0b; color: #000; padding: 5px 10px; border-radius: 3px; font-size: 12px; }
    </style>
</head>
<body>

<div id="login-box" class="center">
    <div style="text-align: center; background: #1e293b; padding: 40px; border-radius: 10px;">
        <h2>Admin Login</h2>
        <input id="u" placeholder="Username"><br>
        <input id="p" type="password" placeholder="Password"><br><br>
        <button onclick="login()">Đăng Nhập</button>
    </div>
</div>

<div id="app" style="display:none">
    <h2>🏥 ICU Real-time Monitor: <span id="current-user-name">...</span></h2>

    <div class="card-container">
        <div class="card"><div class="avg">AVG SYS: <span id="sys-avg">0</span></div><div id="sys" class="big">0</div>mmHg</div>
        <div class="card"><div class="avg">AVG DIA: <span id="dia-avg">0</span></div><div id="dia" class="big">0</div>mmHg</div>
        <div class="card"><div class="avg">AVG HR: <span id="hr-avg">0</span></div><div id="hr" class="big">0</div>bpm</div>
    </div>

    <canvas id="chart" height="100"></canvas>

    <h3>Lịch sử đo thực tế</h3>
    <div style="max-height: 300px; overflow-y: auto;">
        <table class="history-table">
            <thead>
                <tr><th>Thời gian</th><th>SYS</th><th>DIA</th><th>HR</th></tr>
            </thead>
            <tbody id="history-data"></tbody>
        </table>
    </div>

    <h3>Danh sách bệnh nhân</h3>
    <div id="user-list"></div>
</div>

<script>
    const API = "https://doanvdk-6.onrender.com"; // Thay bằng link Render của bạn
    let TOKEN = "";
    let timer = null;

    const ctx = document.getElementById('chart').getContext('2d');
    let chart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [{ label: 'SYS', data: [], borderColor: '#0ff', tension: 0.3 }] },
        options: { scales: { y: { grid: { color: '#334155' } } } }
    });

    function login() {
        fetch(API+"/api/login", {
            method:"POST",
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({username: u.value, password: p.value})
        })
        .then(r => r.json())
        .then(d => {
            TOKEN = d.token;
            document.getElementById("login-box").style.display="none";
            document.getElementById("app").style.display="block";
            loadUsers();
        }).catch(() => alert("Sai thông tin!"));
    }

    function loadUsers() {
        fetch(API+"/api/users", {headers:{Authorization: TOKEN}})
        .then(r => r.json())
        .then(data => {
            const list = document.getElementById("user-list");
            list.innerHTML = data.map(usr => `
                <div class="user-item">
                    <span style="cursor:pointer" onclick="selectUser(${usr[0]}, '${usr[1]}')">👤 ${usr[1]} (ID: ${usr[0]})</span>
                    <button class="edit-btn" onclick="rename(${usr[0]}, '${usr[1]}')">Sửa tên</button>
                </div>
            `).join('');
        });
    }

    function rename(id, oldName) {
        let newName = prompt("Nhập tên mới:", oldName);
        if(newName) {
            fetch(API+"/api/update_name", {
                method:"POST",
                headers:{'Content-Type':'application/json', Authorization: TOKEN},
                body: JSON.stringify({id: id, new_name: newName})
            }).then(() => loadUsers());
        }
    }

    function selectUser(id, name) {
        document.getElementById("current-user-name").innerText = name;
        if(timer) clearInterval(timer);
        timer = setInterval(() => {
            fetch(API+"/api/data", {headers:{Authorization: TOKEN}})
            .then(r => r.json())
            .then(data => {
                let logs = data.filter(x => x[3] == id);
                if(logs.length > 0) {
                    let last = logs[logs.length - 1];
                    document.getElementById("sys").innerText = last[0];
                    document.getElementById("dia").innerText = last[1];
                    document.getElementById("hr").innerText = last[2];

                    // Tính trung bình
                    document.getElementById("sys-avg").innerText = (logs.reduce((a,b)=>a+b[0],0)/logs.length).toFixed(1);
                    document.getElementById("dia-avg").innerText = (logs.reduce((a,b)=>a+b[1],0)/logs.length).toFixed(1);
                    document.getElementById("hr-avg").innerText = (logs.reduce((a,b)=>a+b[2],0)/logs.length).toFixed(1);

                    // Lịch sử
                    document.getElementById("history-data").innerHTML = logs.slice().reverse().map(l => `
                        <tr><td>${l[4]}</td><td>${l[0]}</td><td>${l[1]}</td><td>${l[2]}</td></tr>
                    `).join('');

                    // Biểu đồ
                    chart.data.labels = logs.slice(-10).map(l => l[4].split(' ')[1]);
                    chart.data.datasets[0].data = logs.slice(-10).map(l => l[0]);
                    chart.update();
                }
            });
        }, 2000);
    }
</script>
</body>
</html>
