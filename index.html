<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ICU Monitor</title>
<script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{background:#020617;color:#e2e8f0;font-family:sans-serif;margin:0}
.center{display:flex;justify-content:center;align-items:center;height:100vh}
.login{background:#0f172a;padding:30px;border-radius:10px}
input{display:block;margin:5px;padding:10px;background:#0f172a;color:white;border:none}
button{background:#22c55e;padding:10px;border:none;color:white}
.sidebar{width:200px;float:left;background:#020617;height:100vh}
.main{margin-left:210px;padding:10px}
.monitor{font-size:30px;margin:20px}
.patient{padding:10px;cursor:pointer}
.patient:hover{background:#1e293b}
</style>
</head>

<body>

<div id="app"></div>

<script>
const API="http://localhost:3000";
let current=null, chart;

// ===== LOGIN =====
function showLogin(){
  app.innerHTML=`
  <div class="center">
    <div class="login">
      <h2>ICU SYSTEM</h2>
      <input id="pass" type="password" placeholder="Admin password">
      <button onclick="login()">LOGIN</button>
    </div>
  </div>`;
}

function login(){
  if(pass.value==="admin123"){
    localStorage.setItem("login","1");
    showDashboard();
  }else alert("Sai mật khẩu");
}

// ===== DASHBOARD =====
function showDashboard(){
  app.innerHTML=`
  <div class="sidebar" id="list"></div>

  <div class="main">
    <div id="info"></div>

    <div class="monitor">
      SYS: <span id="sys">--</span> |
      DIA: <span id="dia">--</span> |
      HR: <span id="hr">--</span>
    </div>

    <canvas id="chart"></canvas>

    <h3>Tạo hồ sơ</h3>
    <input id="name" placeholder="Tên">
    <input id="dob" placeholder="DOB">
    <input id="cccd" placeholder="CCCD">
    <input id="address" placeholder="Địa chỉ">
    <button onclick="add()">Tạo</button>
  </div>`;

  load();
}

// ===== LOAD PATIENT =====
async function load(){
  let res=await fetch(API+"/patient");
  let data=await res.json();

  list.innerHTML="";
  data.forEach(p=>{
    let div=document.createElement("div");
    div.className="patient";
    div.innerText=p.name;
    div.onclick=()=>select(p);
    list.appendChild(div);
  });
}

// ===== SELECT PATIENT =====
function select(p){
  current=p;

  info.innerHTML=`
    <b>${p.name}</b><br>
    ${p.dob}<br>
    ${p.cccd}<br>
    ${p.address}
  `;

  if(p.records.length>0){
    let s=0,d=0,h=0;
    p.records.forEach(x=>{s+=x.sys;d+=x.dia;h+=x.hr});
    sys.innerText=(s/p.records.length).toFixed(0);
    dia.innerText=(d/p.records.length).toFixed(0);
    hr.innerText=(h/p.records.length).toFixed(0);
    draw(p.records);
  }
}

// ===== CHART =====
function draw(r){
  let labels=r.map(x=>x.time);
  let data=r.map(x=>x.sys);

  if(chart) chart.destroy();

  chart=new Chart(document.getElementById("chart"),{
    type:"line",
    data:{labels,
      datasets:[{data,borderColor:"#22c55e"}]
    }
  });
}

// ===== ADD PATIENT =====
async function add(){
  await fetch(API+"/patient",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      name:name.value,
      dob:dob.value,
      cccd:cccd.value,
      address:address.value
    })
  });
  load();
}

// ===== REALTIME =====
const socket=io(API);
socket.on("data",(d)=>{
  sys.innerText=d.sys;
  dia.innerText=d.dia;
  hr.innerText=d.hr;
});

// ===== INIT =====
if(localStorage.getItem("login")) showDashboard();
else showLogin();
</script>

</body>
</html>
