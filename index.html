<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Health Monitor Pro</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI';
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    color: white;
}

.container {
    width: 420px;
    margin: 30px auto;
    background: #1e293b;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    border-radius: 10px;
    border: none;
    background: #334155;
    color: white;
    font-size: 14px;
}

input:focus {
    outline: 2px solid #38bdf8;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
}

.save { background: #22c55e; }
.load { background: #3b82f6; }

.records {
    margin-top: 15px;
    max-height: 180px;
    overflow-y: auto;
    background: #020617;
    padding: 10px;
    border-radius: 10px;
}

.records div {
    padding: 8px;
    border-bottom: 1px solid #334155;
    cursor: pointer;
}

.records div:hover {
    background: #1e40af;
}

.preview {
    margin-top: 10px;
    background: #020617;
    padding: 10px;
    border-radius: 10px;
    font-size: 14px;
}

.label {
    font-size: 13px;
    margin-top: 10px;
    color: #94a3b8;
}
</style>
</head>

<body>

<div class="container">
    <h2>🩺 Health Monitor</h2>

    <div class="label">Thông tin cá nhân</div>
    <input id="name" placeholder="Họ và tên">
    <input id="dob" type="date">
    <input id="cccd" placeholder="CCCD">
    <input id="address" placeholder="Nơi ở">

    <div class="label">Chỉ số đo</div>
    <input id="sys" placeholder="SYS">
    <input id="dia" placeholder="DIA">
    <input id="pul" placeholder="PULSE">

    <button class="save" onclick="save()">💾 Lưu dữ liệu</button>
    <button class="load" onclick="load()">📂 Xem lịch sử</button>

    <div class="records" id="records"></div>
    <div class="preview" id="preview"></div>
</div>

<script>
const API = "http://127.0.0.1:5000";

function save() {
    const data = {
        user: name.value,   // giữ API cũ
        name: name.value,
        dob: dob.value,
        cccd: cccd.value,
        address: address.value,
        sys: sys.value,
        dia: dia.value,
        pul: pul.value
    };

    fetch(API + "/save", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    })
    .then(res => res.text())
    .then(msg => {
        alert(msg);
        load();
    });
}

function load() {
    fetch(API + "/records/" + name.value)
    .then(res => res.json())
    .then(files => {
        records.innerHTML = "";
        files.forEach(f => {
            const div = document.createElement("div");
            div.innerText = "📄 " + f;
            div.onclick = () => readFile(f);
            records.appendChild(div);
        });
    });
}

function readFile(file) {
    fetch(API + "/records/" + name.value + "/" + file)
    .then(res => res.text())
    .then(text => {
        preview.innerText = text;
    });
}
</script>

</body>
</html>
