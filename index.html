<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICU Monitor - Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { margin: 0; background: #0f172a; color: #0ff; font-family: 'Segoe UI', monospace; }
        .center { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: #1e293b; padding: 30px; border-radius: 10px; border: 1px solid #334155; text-align: center; }
        input { padding: 12px; margin: 8px 0; border: 1px solid #334155; border-radius: 5px; background: #020617; color: #fff; width: 200px; display: block; }
        button { padding: 10px 25px; background: #0ff; border: none; border-radius: 5px; cursor: pointer; color: #020617; font-weight: bold; transition: 0.3s; }
        button:hover { background: #00cccc; }
        
        #app { padding: 20px; display: none; }
        .card-container { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .card { flex: 1; min-width: 120px; padding: 20px; background: #020617; border: 1px solid #0ff; border-radius: 8px; text-align: center; }
        .big { font-size: 40px; font-weight: bold; margin-top: 10px; }
        
        .user-list { margin-top: 20px; background: #020617; border: 1px solid #334155; border-radius: 8px; }
        .user { cursor: pointer; padding: 15px; border-bottom: 1px solid #1e293b; transition: 0.2s; }
        .user:hover { background: #1e293b; color: #fff; }
        .user:last-child { border-bottom: none; }
        
        canvas { background: #020617; border-radius: 8px; padding: 10px; max-height: 400px; width: 100% !important; }
        h2, h3 { border-left: 4px solid #0ff; padding-left: 10px; }
    </style>
</head>
<body>

<div id="login-screen" class="center">
    <div class="login-box">
        <h2>Admin Login</h2>
        <input id="user-input" type="text" placeholder="Username">
        <input id="pass-input" type="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>
</div>

<div id="app">
    <h2>🏥 ICU Real-time Monitor</h2>

    <div class="card-container">
        <div class="card">SYS (mmHg)<div id="sys" class="big">0</div></div>
        <div class="card">DIA (mmHg)<div id="dia" class="big">0</div></div>
        <div class="card">HR (bpm)<div id="hr" class="big">0</div></div>
    </div>

    <div style="margin-bottom: 30px;">
        <canvas id="chart"></canvas>
    </div>

    <h3>Bệnh nhân đang theo dõi</h3>
    <div id="users-container" class="user-list"></div>
</div>

<script>
    const API = "https://doanvdk.onrender.com";
    let TOKEN = "";
    let updateTimer = null; // Biến quản lý vòng lặp cập nhật dữ liệu

    // Khởi tạo Chart.js
    const ctx = document.getElementById('chart').getContext('2d');
    let chart = new Chart(ctx, {
        type: "line",
        data: {
            labels: [],
            datasets: [{
                label: 'Systolic (Tâm thu)',
                data: [],
                borderColor: '#0ff',
                backgroundColor: 'rgba(0, 255, 255, 0.1)',
                borderWidth: 2,
                tension: 0.3,
                fill: true
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: { grid: { color: '#1e293b' }, ticks: { color: '#0ff' } },
                x: { grid: { display: false }, ticks: { color: '#0ff' } }
            }
        }
    });

    // Hàm Đăng nhập
    function login() {
        const u = document.getElementById("user-input").value;
        const p = document.getElementById("pass-input").value;

        fetch(`${API}/api/login`, {
            method: "POST",
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        })
        .then(r => {
            if (!r.ok) throw new Error("Unauthorized");
            return r.json();
        })
        .then(d => {
            TOKEN = d.token;
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("app").style.display = "block";
            loadUsers();
        })
        .catch(err => alert("Đăng nhập thất bại! Kiểm tra lại tài khoản."));
    }

    // Hàm tải danh sách User
    function loadUsers() {
        fetch(`${API}/api/users`, { headers: { Authorization: TOKEN } })
        .then(r => r.json())
        .then(data => {
            const container = document.getElementById("users-container");
            container.innerHTML = "";
            data.forEach(u => {
                // u[0] là ID, u[1] là tên
                container.innerHTML += `<div class="user" onclick="selectUser(${u[0]}, '${u[1]}')">👤 ${u[1]} (ID: ${u[0]})</div>`;
            });
        });
    }

    // Hàm chọn bệnh nhân và bắt đầu theo dõi
    function selectUser(id, name) {
        alert("Đang bắt đầu theo dõi: " + name);
        
        // Xóa vòng lặp cũ nếu có để tránh lag
        if (updateTimer) clearInterval(updateTimer);
        
        // Reset biểu đồ khi đổi người
        chart.data.labels = [];
        chart.data.datasets[0].data = [];
        chart.update();

        // Chạy vòng lặp lấy dữ liệu mỗi 2 giây (giảm tải cho Render.com)
        updateTimer = setInterval(() => {
            fetch(`${API}/api/data`, { headers: { Authorization: TOKEN } })
            .then(r => r.json())
            .then(data => {
                // Lọc dữ liệu theo ID bệnh nhân (Giả định cột 3 là ID)
                let userLogs = data.filter(x => x[3] == id);
                
                if (userLogs.length > 0) {
                    let last = userLogs[userLogs.length - 1]; // Lấy bản ghi mới nhất
                    
                    // Cập nhật số liệu trên Card
                    document.getElementById("sys").innerText = last[0];
                    document.getElementById("dia").innerText = last[1];
                    document.getElementById("hr").innerText = last[2];

                    // Cập nhật Biểu đồ
                    const now = new Date().toLocaleTimeString();
                    chart.data.labels.push(now);
                    chart.data.datasets[0].data.push(last[0]);

                    // Chỉ giữ lại 15 điểm dữ liệu gần nhất để biểu đồ không bị rối
                    if (chart.data.labels.length > 15) {
                        chart.data.labels.shift();
                        chart.data.datasets[0].data.shift();
                    }
                    
                    chart.update();
                }
            })
            .catch(err => console.error("Lỗi lấy dữ liệu:", err));
        }, 2000);
    }
</script>

</body>
</html>
