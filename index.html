<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ICU Monitor</title>
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#020617;
  color:#e2e8f0;
}

.sidebar{
  width:220px;
  height:100vh;
  background:#020617;
  border-right:1px solid #1e293b;
  float:left;
  padding:10px;
}

.sidebar div{
  padding:10px;
  cursor:pointer;
  color:#94a3b8;
}
.sidebar div:hover{
  color:#fff;
}

.main{
  margin-left:220px;
  padding:20px;
}

.card{
  background:#0f172a;
  padding:20px;
  margin-bottom:15px;
  border-radius:10px;
}

input{
  width:100%;
  padding:10px;
  margin:5px 0;
  background:#020617;
  border:none;
  color:white;
}

button{
  width:100%;
  padding:10px;
  background:#16a34a;
  border:none;
  color:white;
  cursor:pointer;
}
.big{
  font-size:40px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" style="padding:100px;text-align:center;">
  <h2>Admin Login</h2>
  <input id="pass" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

<div class="sidebar" id="list"></div>

<div class="main">

<div class="card" id="info">Chưa chọn bệnh nhân</div>

<div class="card">
  SYS <div class="big" id="sys">--</div>
  DIA <div class="big" id="dia">--</div>
  HR <div class="big" id="hr">--</div>
</div>

<div class="card">
  <h3>Tạo hồ sơ</h3>
  <input id="name" placeholder="Tên">
  <input id="dob" placeholder="Ngày sinh">
  <input id="cccd" placeholder="CCCD">
  <input id="address" placeholder="Địa chỉ">
  <button onclick="add()">Tạo</button>
</div>

</div>
</div>

<script>
const API="http://localhost:3000";

let current=null;

async function login(){
  let res = await fetch(API+"/login",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:pass.value})
  });

  let data = await res.json();

  if(data.success){
    loginDiv.style.display="none";
    app.style.display="block";
    load();
  }else{
    alert("Sai mật khẩu");
  }
}

async function load(){
  let res = await fetch(API+"/patients");
  let data = await res.json();

  list.innerHTML="";

  data.forEach(p=>{
    let div=document.createElement("div");
    div.innerText=p.name || "Không tên";

    div.onclick=()=>{
      current=p;
      info.innerHTML=`
        <b>${p.name}</b><br>
        ${p.dob}<br>
        CCCD: ${p.cccd}<br>
        ${p.address}
      `;
    }

    list.appendChild(div);
  });
}

async function add(){
  if(!name.value || !cccd.value){
    alert("Nhập thiếu!");
    return;
  }

  await fetch(API+"/patient",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      name:name.value.trim(),
      dob:dob.value.trim(),
      cccd:cccd.value.trim(),
      address:address.value.trim()
    })
  });

  name.value="";
  dob.value="";
  cccd.value="";
  address.value="";

  load();
}

// REALTIME
const socket = io(API);

socket.on("data",(d)=>{
  sys.innerText=d.sys;
  dia.innerText=d.dia;
  hr.innerText=d.hr;
});
</script>

</body>
</html>
