<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Blood Pressure System</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #0f172a;
    color: white;
}

.login, .dashboard {
    display: none;
    padding: 20px;
}

input {
    padding: 10px;
    margin: 5px;
    width: 200px;
}

button {
    padding: 10px 20px;
    background: #22c55e;
    border: none;
    color: white;
    cursor: pointer;
}

.container {
    display: flex;
}

.left {
    width: 60%;
}

.right {
    width: 40%;
    background: #1e293b;
    padding: 20px;
}

.patient {
    padding: 10px;
    background: #334155;
    margin: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login" style="display:block">
    <h2>Login</h2>
    <input id="user" placeholder="Username"><br>
    <input id="pass" type="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dash">
    <div class="container">

        <!-- LEFT -->
        <div class="left">
            <h3>Patients</h3>
            <div id="patients"></div>

            <canvas id="chart"></canvas>
        </div>

        <!-- RIGHT -->
        <div class="right">
            <h3>Create Patient</h3>

            <input id="name" placeholder="Tên"><br>
            <input id="dob" placeholder="Ngày sinh"><br>
            <input id="cccd" placeholder="CCCD"><br>
            <input id="addr" placeholder="Nơi ở"><br>

            <button onclick="create()">Tạo hồ sơ</button>
        </div>

    </div>
</div>

<script>
let currentFolder = null
let chart

function login() {
    fetch("/login", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            username: user.value,
            password: pass.value
        })
    })
    .then(r=>r.json())
    .then(d=>{
        if(d.status==="ok"){
            loginDiv = document.getElementById("login")
            dash = document.getElementById("dash")

            loginDiv.style.display="none"
            dash.style.display="block"

            loadPatients()
        }
    })
}

function create(){
    fetch("/create_patient",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
            name:name.value,
            dob:dob.value,
            cccd:cccd.value,
            addr:addr.value
        })
    }).then(()=>loadPatients())
}

function loadPatients(){
    fetch("/patients")
    .then(r=>r.json())
    .then(data=>{
        let html=""
        data.forEach(p=>{
            html += `<div class="patient" onclick="select('${p}')">${p}</div>`
        })
        patients.innerHTML = html
    })
}

function select(folder){
    currentFolder = folder

    fetch("/records/"+folder)
    .then(r=>r.json())
    .then(data=>{
        let labels = data.map(x=>x.time)
        let sys = data.map(x=>x.sys)
        let dia = data.map(x=>x.dia)
        let pulse = data.map(x=>x.pulse)

        if(chart) chart.destroy()

        chart = new Chart(document.getElementById("chart"),{
            type:"line",
            data:{
                labels: labels,
                datasets:[
                    {label:"SYS", data:sys, borderColor:"red"},
                    {label:"DIA", data:dia, borderColor:"blue"},
                    {label:"PULSE", data:pulse, borderColor:"green"}
                ]
            }
        })
    })
}
</script>

</body>
</html>
