<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Quản Lý ICU </title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #0ea5e9; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Chỉnh khung login rộng hơn */
        #login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: var(--card); padding: 40px; border-radius: 15px; text-align: center; width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .login-box input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #334155; background: #0f172a; color: white; }
        .login-box button { width: 97%; padding: 12px; background: var(--accent); border: none; color: white; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }

        .sidebar { width: 320px; background: var(--card); border-right: 1px solid #334155; display: flex; flex-direction: column; }
        .user-item { padding: 15px; background: #334155; margin: 10px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .user-item.active { background: var(--accent); }
        .btn-edit { background: #f59e0b; border: none; color: white; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }

        .main { flex: 1; padding: 25px; overflow-y: auto; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-box { background: #020617; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid var(--accent); }
        .stat-box h1 { margin: 5px 0; color: var(--accent); font-size: 40px; }
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; text-align: center; }
        .btn-logout { width: 90%; margin: 15px auto; padding: 10px; background: #ef4444; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2>Admin Login</h2>
        <input id="u" placeholder="Tên đăng nhập">
        <input id="p" type="password" placeholder="Mật khẩu">
        <button onclick="login()">VÀO HỆ THỐNG</button>
    </div>
</div>

<div class="sidebar">
    <button class="btn-logout" onclick="logout()">ĐĂNG XUẤT</button>
    <div id="user-list"></div>
</div>

<div class="main">
    <div id="dashboard" style="display:none;">
        <h2 id="patient-name">Danh Sách Bệnh Nhân</h2>
        <div class="stats-grid">
            <div class="stat-box">Tâm thu (SYS) <h1 id="avg-sys">0</h1> mmHg</div>
            <div class="stat-box">Tâm trương (DIA) <h1 id="avg-dia">0</h1> mmHg</div>
            <div class="stat-box">Nhịp tim (HR) <h1 id="avg-hr">0</h1> bpm</div>
        </div>
        <canvas id="chart" height="90"></canvas>
        <table style="margin-top:20px;">
            <thead><tr><th>Thời gian</th><th>SYS</th><th>DIA</th><th>HR</th><th>Thiết bị</th></tr></thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
</div>

<script>
    const API = "https://doanvdk-9.onrender.com";
    let TOKEN = "", selectedId = null, timer = null;

    const chart = new Chart(document.getElementById('chart'), {
        type: 'line',
        data: { labels: [], datasets: [{ label: 'SYS (mmHg)', data: [], borderColor: '#0ea5e9', tension: 0.3, fill: true, backgroundColor: 'rgba(14, 165, 233, 0.1)' }] },
        options: { animation: false, scales: { y: { beginAtZero: false } } }
    });

    window.onload = () => {
        const saved = localStorage.getItem("icu_token");
        if (saved) { TOKEN = saved; document.getElementById("login-screen").style.display = "none"; loadUsers(); }
    };

    function login() {
        fetch(API+"/api/login", {
            method:"POST",
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({username: u.value, password: p.value})
        }).then(r => r.json()).then(d => {
            if(d.token) {
                TOKEN = d.token;
                localStorage.setItem("icu_token", TOKEN);
                document.getElementById("login-screen").style.display = "none";
                loadUsers();
            } else { alert("Sai tài khoản!"); }
        });
    }

    function logout() { localStorage.clear(); location.reload(); }

    function loadUsers() {
        fetch(API+"/api/users", {headers:{Authorization: TOKEN}})
        .then(r => r.status === 403 ? logout() : r.json())
        .then(data => {
            document.getElementById("user-list").innerHTML = data.map(usr => `
                <div class="user-item ${selectedId == usr[0] ? 'active' : ''}" id="item-${usr[0]}" onclick="selectPatient('${usr[0]}', '${usr[1]}')">
                    <span>${usr[1]}</span>
                    <button class="btn-edit" onclick="event.stopPropagation(); changeName('${usr[0]}', '${usr[1]}')">Sửa</button>
                </div>
            `).join('');
        });
    }

    function changeName(id, old) {
        const n = prompt("Đổi tên bệnh nhân:", old);
        if (n && n.trim() !== "") {
            fetch(API + "/api/update_name", {
                method: "POST",
                headers: { 'Content-Type': 'application/json', Authorization: TOKEN },
                body: JSON.stringify({ id: id, new_name: n.trim() })
            }).then(() => loadUsers());
        }
    }

    function selectPatient(id, name) {
        selectedId = id;
        document.querySelectorAll('.user-item').forEach(e => e.classList.remove('active'));
        document.getElementById(`item-${id}`).classList.add('active');
        document.getElementById("dashboard").style.display = "block";
        document.getElementById("patient-name").innerText = "Bệnh nhân: " + name;

        // Reset dữ liệu cũ để tránh nhầm lẫn
        document.getElementById("avg-sys").innerText = "0";
        document.getElementById("avg-dia").innerText = "0";
        document.getElementById("avg-hr").innerText = "0";
        document.getElementById("table-body").innerHTML = "<tr><td colspan='5'>Đang tải...</td></tr>";
        chart.data.labels = []; chart.data.datasets[0].data = []; chart.update();

        if(timer) clearInterval(timer);
        refreshData();
        timer = setInterval(refreshData, 5000);
    }

    function refreshData() {
        if(!selectedId) return;
        fetch(API + `/api/history?user_id=${selectedId}`, {headers:{Authorization: TOKEN}})
        .then(r => r.json())
        .then(logs => {
            const table = document.getElementById("table-body");
            if(logs.length === 0) {
                table.innerHTML = "<tr><td colspan='5'>Chưa có dữ liệu đo</td></tr>";
                return;
            }

            document.getElementById("avg-sys").innerText = (logs.reduce((a,b)=>a+b[0],0)/logs.length).toFixed(1);
            document.getElementById("avg-dia").innerText = (logs.reduce((a,b)=>a+b[1],0)/logs.length).toFixed(1);
            document.getElementById("avg-hr").innerText = (logs.reduce((a,b)=>a+b[2],0)/logs.length).toFixed(1);

            table.innerHTML = logs.slice(0, 15).map(l => 
                `<tr><td>${l[3]}</td><td>${l[0]}</td><td>${l[1]}</td><td>${l[2]}</td><td>${l[4]}</td></tr>`
            ).join('');

            const pts = logs.slice(0, 10).reverse();
            chart.data.labels = pts.map(p => p[3].split(' ')[1]);
            chart.data.datasets[0].data = pts.map(p => p[0]);
            chart.update();
        });
    }
</script>
</body>
</html>
