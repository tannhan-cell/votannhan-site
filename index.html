<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Medical Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #0f172a;
    color: white;
}

.login, .dashboard {
    display: none;
}

.center {
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card {
    background:#1e293b;
    padding:30px;
    border-radius:15px;
}

input {
    width:100%;
    padding:10px;
    margin:5px 0;
}

button {
    padding:10px;
    background:#22c55e;
    border:none;
    color:white;
    cursor:pointer;
}

.sidebar {
    width:300px;
    background:#111827;
    height:100vh;
    overflow:auto;
    float:left;
}

.main {
    margin-left:300px;
    padding:20px;
}

.patient {
    padding:10px;
    border-bottom:1px solid gray;
    cursor:pointer;
}

.form {
    position:fixed;
    right:0;
    top:0;
    width:300px;
    background:#1e293b;
    height:100vh;
    padding:20px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login center">
    <div class="card">
        <h2>Admin Login</h2>
        <input id="user" placeholder="User">
        <input id="pass" type="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard">
    <div class="sidebar" id="patients"></div>

    <div class="main">
        <h2 id="title">Chọn bệnh nhân</h2>
        <canvas id="chart"></canvas>
        <div id="data"></div>
    </div>

    <div class="form">
        <h3>Tạo hồ sơ</h3>
        <input id="name" placeholder="Tên">
        <input id="dob" placeholder="Ngày sinh">
        <input id="cccd" placeholder="CCCD">
        <input id="address" placeholder="Nơi ở">
        <button onclick="create()">Tạo</button>
    </div>
</div>

<script>
document.querySelector(".login").style.display="flex"

async function login(){
    let res = await fetch("/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            user: user.value,
            pass: pass.value
        })
    })
    let data = await res.json()
    if(data.status=="ok"){
        document.querySelector(".login").style.display="none"
        document.querySelector(".dashboard").style.display="block"
        loadPatients()
    }
}

async function loadPatients(){
    let res = await fetch("/patients")
    let data = await res.json()

    patients.innerHTML=""
    data.forEach(p=>{
        patients.innerHTML += `
        <div class="patient" onclick="openPatient('${p}')">
            ${p}
            <button onclick="del('${p}')">X</button>
        </div>`
    })
}

async function create(){
    await fetch("/create",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            name:name.value,
            dob:dob.value,
            cccd:cccd.value,
            address:address.value
        })
    })
    loadPatients()
}

async function del(p){
    await fetch("/delete/"+p,{method:"DELETE"})
    loadPatients()
}

async function openPatient(p){
    title.innerText = p

    let res = await fetch("/records/"+p)
    let files = await res.json()

    let sys=[], dia=[], pulse=[]

    for(let f of files){
        let txt = await fetch(`/read/${p}/${f}`)
        let t = await txt.text()

        let s = t.match(/Tâm thu: (\d+)/)[1]
        let d = t.match(/Tâm trương: (\d+)/)[1]
        let pl = t.match(/Nhịp tim: (\d+)/)[1]

        sys.push(s)
        dia.push(d)
        pulse.push(pl)
    }

    new Chart(document.getElementById("chart"), {
        type: 'line',
        data: {
            labels: files,
            datasets: [
                {label:"Tâm thu", data:sys, borderColor:"red"},
                {label:"Tâm trương", data:dia, borderColor:"blue"},
                {label:"Nhịp tim", data:pulse, borderColor:"green"}
            ]
        }
    })
}
</script>

</body>
</html>
