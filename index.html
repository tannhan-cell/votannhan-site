<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Medical Pro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;background:#0f172a;color:white;font-family:sans-serif}
#login{display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:#1e293b;padding:30px;border-radius:10px}
#app{display:none}
.sidebar{width:200px;background:#020617;height:100vh;padding:20px;float:left}
.main{margin-left:220px;padding:20px}
.card{background:#1e293b;padding:20px;border-radius:10px;margin:10px}
.user{cursor:pointer;padding:10px;background:#1e293b;margin:5px}
</style>

</head>

<body>

<div id="login">
<div class="box">
<h2>Login</h2>
<input id="pass" type="password"><br>
<button onclick="doLogin()">Login</button>
</div>
</div>

<div id="app">
<div class="sidebar">
<button onclick="show('dash')">Dashboard</button>
<button onclick="show('users')">Users</button>
</div>

<div class="main">

<div id="dash">
<h2>Dashboard</h2>
<div class="card">
SYS:<span id="sys"></span>
DIA:<span id="dia"></span>
HR:<span id="hr"></span>
</div>
<canvas id="chart"></canvas>
</div>

<div id="users" style="display:none">
<h2>Users</h2>
<div id="list"></div>
</div>

<div id="detail" style="display:none">
<h2 id="name"></h2>
<canvas id="userChart"></canvas>
<div id="his"></div>
</div>

</div>
</div>

<script>

const API="https://YOUR_SERVER_URL";

function doLogin(){
  if(pass.value==="123456"){
    login.style.display="none";
    app.style.display="block";
  }
}

function show(p){
  dash.style.display="none";
  users.style.display="none";
  detail.style.display="none";
  document.getElementById(p).style.display="block";
}

// ===== DASHBOARD =====
let chart=new Chart(chart,{
  type:"line",
  data:{labels:[],datasets:[{data:[]}]}
});

setInterval(()=>{
fetch(API+"/api/data")
.then(r=>r.json())
.then(d=>{
  sys.innerText=d.sys;
  dia.innerText=d.dia;
  hr.innerText=d.hr;

  chart.data.labels.push(new Date().toLocaleTimeString());
  chart.data.datasets[0].data.push(d.sys);
  chart.update();
});
},2000);

// ===== USERS =====
function loadUsers(){
fetch(API+"/api/users")
.then(r=>r.json())
.then(u=>{
  list.innerHTML="";
  u.forEach(x=>{
    list.innerHTML+=`<div class="user" onclick="openUser('${x.chat_id}','${x.name}')">${x.name}</div>`;
  });
});
}

function openUser(id,nameUser){
show('detail');
name.innerText=nameUser;

fetch(API+"/api/history/"+id)
.then(r=>r.json())
.then(d=>{
  let labels=[],data=[];
  his.innerHTML="";
  d.forEach(x=>{
    labels.push(x.time);
    data.push(x.sys);

    his.innerHTML+=`<div>${x.time} SYS:${x.sys}</div>`;
  });

  new Chart(userChart,{
    type:"line",
    data:{labels:labels,datasets:[{data:data}]}
  });
});
}

loadUsers();

</script>

</body>
</html>
