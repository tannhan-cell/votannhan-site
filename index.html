<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>ICU Monitor</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
body{background:#020617;color:white;}
.card{background:#0f172a;border-radius:15px;border:none;}
.sidebar{height:100vh;background:#020617;padding:15px;}
.patient{cursor:pointer;padding:6px;}
.patient:hover{background:#1e293b;}
.big{font-size:40px;font-weight:bold;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="container mt-5 text-center">
  <h2>🔐 Admin</h2>
  <input id="pass" type="password" class="form-control my-3">
  <button class="btn btn-success" onclick="login()">Login</button>
</div>

<!-- MAIN -->
<div id="main" style="display:none;">
<div class="row">

<div class="col-3 sidebar">
  <h4>Patients</h4>
  <ul id="patients"></ul>
</div>

<div class="col-9 p-3">

<div class="card p-3 mb-3">
  <h5>Tạo hồ sơ</h5>
  <input id="name" placeholder="Tên" class="form-control mb-1">
  <input id="dob" placeholder="DOB" class="form-control mb-1">
  <input id="cccd" placeholder="CCCD" class="form-control mb-1">
  <input id="address" placeholder="Address" class="form-control mb-1">
  <button onclick="addPatient()" class="btn btn-success">Tạo</button>
</div>

<div class="card p-3 mb-3">
  <h5 id="pname">---</h5>
</div>

<div class="card p-3 mb-3">
  <ul id="records"></ul>
</div>

<button onclick="fake()" class="btn btn-danger mb-3">ĐO THỬ</button>

<div id="monitor" style="display:none;">
<div class="row">
<div class="col-4"><div class="card p-3 text-center">SYS<div id="sys" class="big text-success">--</div></div></div>
<div class="col-4"><div class="card p-3 text-center">DIA<div id="dia" class="big text-warning">--</div></div></div>
<div class="col-4"><div class="card p-3 text-center">HR<div id="hr" class="big text-danger">--</div></div></div>
</div>

<div class="card p-3 mt-3">
<canvas id="chart"></canvas>
</div>
</div>

</div>
</div>
</div>

<script>

const API = "https://your-render-url.onrender.com";
const socket = io(API);

let currentPatient = null;
let chart;

// login
function login(){
  if(pass.value==="admin123"){
    localStorage.setItem("login","true");
    location.reload();
  }
}

window.onload=()=>{
  if(localStorage.getItem("login")==="true"){
    loginPage.style.display="none";
    main.style.display="block";
    load();
  }
}

// load bệnh nhân
async function load(){
  let res = await fetch(API+"/patient");
  let data = await res.json();

  patients.innerHTML="";
  data.forEach(p=>{
    let li=document.createElement("li");
    li.className="patient";
    li.innerText=p.name;
    li.onclick=()=>select(p);
    patients.appendChild(li);
  });
}

// tạo
async function addPatient(){
  await fetch(API+"/patient",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      name:name.value,
      dob:dob.value,
      cccd:cccd.value,
      address:address.value
    })
  });
  load();
}

// chọn
function select(p){
  currentPatient=p;
  pname.innerText=p.name;

  records.innerHTML="";
  (p.records||[]).forEach(r=>{
    let li=document.createElement("li");
    li.innerText=r.time;
    li.onclick=()=>show(r);
    records.appendChild(li);
  });
}

// hiển thị
function show(r){
  monitor.style.display="block";
  sys.innerText=r.sys;
  dia.innerText=r.dia;
  hr.innerText=r.hr;

  draw([r]);
}

// chart
function draw(data){
  if(chart) chart.destroy();

  chart=new Chart(chartCanvas,{
    type:"line",
    data:{
      labels:data.map(x=>x.time),
      datasets:[
        {label:"SYS",data:data.map(x=>x.sys),borderColor:"green"},
        {label:"DIA",data:data.map(x=>x.dia),borderColor:"yellow"},
        {label:"HR",data:data.map(x=>x.hr),borderColor:"red"}
      ]
    }
  });
}

// realtime
socket.on("newData",(msg)=>{
  if(!currentPatient) return;
  if(msg.cccd!==currentPatient.cccd) return;

  currentPatient.records.push(msg.data);
  select(currentPatient);
  show(msg.data);
});

// test đo
async function fake(){
  if(!currentPatient) return alert("chọn bệnh nhân");

  await fetch(API+"/record/"+currentPatient.cccd,{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      sys:120+Math.random()*20,
      dia:80+Math.random()*10,
      hr:70+Math.random()*20
    })
  });
}

</script>

</body>
</html>
