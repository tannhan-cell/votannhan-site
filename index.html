<!DOCTYPE html>
<html>
<head>
  <title>Quản lý huyết áp</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h2>Đăng nhập</h2>
<input type="password" id="pass">
<button onclick="login()">Login</button>

<div id="main" style="display:none">

<h2>Thêm bệnh nhân</h2>
<input id="name" placeholder="Tên">
<input id="dob" placeholder="Ngày sinh">
<input id="cccd" placeholder="CCCD">
<input id="address" placeholder="Địa chỉ">
<button onclick="add()">Thêm</button>

<h2>Danh sách</h2>
<ul id="list"></ul>

<canvas id="chart"></canvas>

</div>

<script>
async function login(){
  let pass = document.getElementById("pass").value;
  let res = await fetch("http://localhost:3000/login",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:pass})
  });
  let data = await res.json();
  if(data.ok){
    document.getElementById("main").style.display="block";
  }else alert("Sai mật khẩu");
}

async function add(){
  let p = {
    name: name.value,
    dob: dob.value,
    cccd: cccd.value,
    address: address.value
  };
  await fetch("http://localhost:3000/patient",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(p)
  });
  load();
}

async function load(){
  let res = await fetch("http://localhost:3000/patient");
  let data = await res.json();

  let list = document.getElementById("list");
  list.innerHTML = "";

  data.forEach(p=>{
    let li = document.createElement("li");
    li.innerText = p.name + " (" + p.cccd + ")";
    li.onclick = ()=>showChart(p);
    list.appendChild(li);
  });
}

function showChart(p){
  let ctx = document.getElementById("chart");
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: p.records.map(r=>r.time),
      datasets: [{
        label: 'SYS',
        data: p.records.map(r=>r.sys),
        borderColor: 'red'
      },{
        label: 'DIA',
        data: p.records.map(r=>r.dia),
        borderColor: 'blue'
      }]
    }
  });
}

load();
</script>

</body>
</html>
