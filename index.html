<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Blood Pressure App</title>
<style>
    body {
        font-family: Arial;
        background: #0f172a;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .card {
        background: #1e293b;
        padding: 25px;
        border-radius: 15px;
        width: 320px;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    h2 {
        text-align: center;
        margin-bottom: 20px;
    }
    input, button {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border-radius: 8px;
        border: none;
    }
    input {
        background: #334155;
        color: white;
    }
    button {
        background: #38bdf8;
        color: black;
        font-weight: bold;
        cursor: pointer;
    }
    button:hover {
        background: #0ea5e9;
    }
    .records {
        margin-top: 15px;
        max-height: 150px;
        overflow-y: auto;
        background: #0f172a;
        padding: 10px;
        border-radius: 10px;
    }
</style>
</head>

<body>
<div class="card">
    <h2>📊 Đo Huyết Áp</h2>

    <input id="user" placeholder="Tên người dùng">
    <input id="sys" placeholder="SYS">
    <input id="dia" placeholder="DIA">
    <input id="pul" placeholder="PULSE">

    <button onclick="save()">💾 Lưu</button>
    <button onclick="load()">📂 Xem dữ liệu</button>

    <div class="records" id="records"></div>
</div>

<script>
const API = "http://127.0.0.1:5000";

function save() {
    const data = {
        user: document.getElementById("user").value,
        sys: document.getElementById("sys").value,
        dia: document.getElementById("dia").value,
        pul: document.getElementById("pul").value
    };

    fetch(API + "/save", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    })
    .then(res => res.text())
    .then(alert);
}

function load() {
    const user = document.getElementById("user").value;

    fetch(API + "/records/" + user)
    .then(res => res.json())
    .then(data => {
        const div = document.getElementById("records");
        div.innerHTML = "";

        data.forEach(f => {
            div.innerHTML += `<div>📄 ${f}</div>`;
        });
    });
}
</script>
</body>
</html>
