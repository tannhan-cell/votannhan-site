<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Medical Pro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#f1f5f9;
}

#loginBox{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.container{display:flex}

.sidebar{
  width:220px;
  background:white;
  height:100vh;
  padding:20px;
}

.btn{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.btn-blue{background:#3b82f6;color:white;}
.btn-green{background:#10b981;color:white;}
.btn-red{background:#ef4444;color:white;}

.main{
  flex:1;
  padding:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:15px;
  margin:10px;
  display:inline-block;
  width:200px;
  text-align:center;
}

.value{font-size:40px;font-weight:bold}

.user{
  background:white;
  padding:15px;
  margin:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<div id="loginBox">
<div class="box">
<h2>Admin Login</h2>
<input id="pass" type="password"><br><br>
<button onclick="doLogin()">Login</button>
</div>
</div>

<div id="app" style="display:none">
<div class="container">

<div class="sidebar">
<button class="btn btn-blue" onclick="show('dash')">Dashboard</button>
<button class="btn btn-green" onclick="show('users')">Users</button>
<button class="btn btn-red" onclick="logout()">Logout</button>
</div>

<div class="main">

<div id="dash">
<div class="card">SYS<div id="sys" class="value">0</div></div>
<div class="card">DIA<div id="dia" class="value">0</div></div>
<div class="card">HR<div id="hr" class="value">0</div></div>

<canvas id="chart"></canvas>
</div>

<div id="users" style="display:none">
<h2>User list</h2>
<div id="list"></div>
</div>

</div>

</div>
</div>

<script>

const API = "http://localhost:3000";
const ws = new WebSocket("ws://localhost:3000");

function doLogin(){
  if(pass.value==="123456"){
    localStorage.setItem("login","true");
    loginBox.style.display="none";
    app.style.display="block";
  }
}

window.onload = ()=>{
  if(localStorage.getItem("login")==="true"){
    loginBox.style.display="none";
    app.style.display="block";
  }
};

function logout(){
  localStorage.removeItem("login");
  location.reload();
}

function show(p){
  dash.style.display="none";
  users.style.display="none";
  document.getElementById(p).style.display="block";
}

// ===== CHART =====
let chart = new Chart(document.getElementById("chart"),{
  type:"line",
  data:{labels:[],datasets:[{data:[]}]}
});

// ===== WEBSOCKET =====
ws.onmessage = (e)=>{
  let msg = JSON.parse(e.data);

  if(msg.type==="data"){
    let d = msg.data;
    sys.innerText=d.sys;
    dia.innerText=d.dia;
    hr.innerText=d.hr;

    chart.data.labels.push(new Date().toLocaleTimeString());
    chart.data.datasets[0].data.push(d.sys);

    if(chart.data.labels.length>20){
      chart.data.labels.shift();
      chart.data.datasets[0].data.shift();
    }

    chart.update();
  }

  if(msg.type==="users"){
    renderUsers(msg.data);
  }
};

// ===== USERS =====
function renderUsers(u){
  list.innerHTML="";
  u.forEach(x=>{
    list.innerHTML+=`<div class="user">${x.name}</div>`;
  });
}

// load users
fetch(API+"/api/users")
.then(r=>r.json())
.then(renderUsers);

</script>

</body>
</html>
