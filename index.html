<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>ICU Admin Panel - Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #0ea5e9; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .sidebar { width: 320px; background: var(--card); border-right: 1px solid #334155; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #334155; }
        .main { flex: 1; padding: 25px; overflow-y: auto; }
        .user-list { flex: 1; overflow-y: auto; padding: 15px; }
        .user-item { padding: 12px; background: #334155; margin-bottom: 10px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; transition: 0.2s; }
        .user-item:hover { background: #475569; }
        .user-item.active { background: var(--accent); border-left: 5px solid #fff; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-box { background: #020617; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid var(--accent); }
        .stat-box h1 { margin: 5px 0; color: var(--accent); font-size: 35px; }
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; text-align: center; }
        .btn-logout { width: 100%; padding: 10px; background: #ef4444; border: none; color: #fff; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div id="login-screen">
    <div style="background: var(--card); padding: 40px; border-radius: 15px; width: 300px; text-align: center;">
        <h3>Admin Login</h3>
        <input id="u" placeholder="Admin" style="width:90%; padding:10px; margin-bottom:10px;">
        <input id="p" type="password" placeholder="Password" style="width:90%; padding:10px; margin-bottom:20px;">
        <button onclick="login()" style="width:97%; padding:10px; background:var(--accent); border:none; color:#fff; cursor:pointer;">Đăng Nhập</button>
    </div>
</div>

<div class="sidebar">
    <div class="sidebar-header">
        <h2 style="margin:0; color:var(--accent);">Hệ thống ICU</h2>
        <button class="btn-logout" onclick="logout()">Đăng Xuất</button>
    </div>
    <div class="user-list" id="user-list"></div>
</div>

<div class="main">
    <div id="no-selection" style="text-align:center; margin-top:100px;">
        <h2>Vui lòng chọn một bệnh nhân từ danh sách</h2>
    </div>
    <div id="dashboard" style="display:none;">
        <h2 id="patient-name">Bệnh nhân</h2>
        <div class="stats-grid">
            <div class="stat-box">Tâm thu (SYS) <h1 id="avg-sys">0</h1> mmHg</div>
            <div class="stat-box">Tâm trương (DIA) <h1 id="avg-dia">0</h1> mmHg</div>
            <div class="stat-box">Nhịp tim (HR) <h1 id="avg-hr">0</h1> bpm</div>
        </div>
        <canvas id="chart" height="80" style="margin-bottom:30px;"></canvas>
        <table>
            <thead><tr><th>Thời gian</th><th>SYS</th><th>DIA</th><th>HR</th><th>Máy</th></tr></thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
</div>

<script>
    const API = "https://doanvdk-12.onrender.com";
    let TOKEN = "";
    let selectedId = null;
    let timer = null;

    const chart = new Chart(document.getElementById('chart'), {
        type: 'line',
        data: { labels: [], datasets: [{ label: 'SYS (mmHg)', data: [], borderColor: '#0ea5e9', backgroundColor: 'rgba(14, 165, 233, 0.1)', fill: true, tension: 0.3 }] },
        options: { animation: false } // Tắt animation để chuyển bệnh nhân siêu nhanh
    });

    window.onload = function() {
        const savedToken = localStorage.getItem("icu_token");
        if (savedToken) {
            TOKEN = savedToken;
            document.getElementById("login-screen").style.display = "none";
            loadUsers();
        }
    };

    function login() {
        fetch(API+"/api/login", {
            method:"POST",
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({username: u.value, password: p.value})
        }).then(r => r.json()).then(d => {
            if(d.token) {
                TOKEN = d.token;
                localStorage.setItem("icu_token", TOKEN);
                document.getElementById("login-screen").style.display = "none";
                loadUsers();
            } else { alert("Sai mật khẩu!"); }
        });
    }

    function logout() {
        localStorage.removeItem("icu_token");
        location.reload();
    }

    function loadUsers() {
        fetch(API+"/api/users", {headers:{Authorization: TOKEN}})
        .then(r => r.status === 403 ? logout() : r.json())
        .then(data => {
            document.getElementById("user-list").innerHTML = data.map(usr => `
                <div class="user-item ${selectedId == usr[0] ? 'active' : ''}" id="item-${usr[0]}" onclick="selectPatient('${usr[0]}', '${usr[1]}')">
                    <span>${usr[1]}</span>
                </div>
            `).join('');
        });
    }

    function selectPatient(id, name) {
        selectedId = id;
        document.querySelectorAll('.user-item').forEach(e => e.classList.remove('active'));
        document.getElementById(`item-${id}`).classList.add('active');
        
        document.getElementById("no-selection").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        document.getElementById("patient-name").innerText = "Bệnh nhân: " + name;

        if(timer) clearInterval(timer);
        refreshData();
        timer = setInterval(refreshData, 5000); // Tải dữ liệu mỗi 5 giây
    }

    function refreshData() {
        if(!selectedId) return;
        fetch(API + `/api/history?user_id=${selectedId}`, {headers:{Authorization: TOKEN}})
        .then(r => r.json())
        .then(logs => {
            if(logs.length === 0) return;
            
            // Cập nhật số liệu AVG
            document.getElementById("avg-sys").innerText = (logs.reduce((a,b)=>a+b[0],0)/logs.length).toFixed(1);
            document.getElementById("avg-dia").innerText = (logs.reduce((a,b)=>a+b[1],0)/logs.length).toFixed(1);
            document.getElementById("avg-hr").innerText = (logs.reduce((a,b)=>a+b[2],0)/logs.length).toFixed(1);

            // Cập nhật bảng (20 dòng gần nhất cho mượt)
            document.getElementById("table-body").innerHTML = logs.slice(0, 20).map(l => 
                `<tr><td>${l[3]}</td><td>${l[0]}</td><td>${l[1]}</td><td>${l[2]}</td><td>${l[4]}</td></tr>`
            ).join('');

            // Cập nhật biểu đồ (15 điểm gần nhất)
            const pts = logs.slice(0, 15).reverse();
            chart.data.labels = pts.map(p => p[3].split(' ')[1]);
            chart.data.datasets[0].data = pts.map(p => p[0]);
            chart.update();
        });
    }
</script>
</body>
</html>
