<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>ICU Monitor</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
body{
  background:#020617;
  color:#e2e8f0;
  font-family: 'Segoe UI', sans-serif;
}

.card{
  background:#0f172a;
  border:none;
  border-radius:15px;
  box-shadow:0 0 20px rgba(0,255,200,0.1);
}

.big-number{
  font-size:48px;
  font-weight:bold;
}

.label{
  color:#94a3b8;
}

.green{color:#22c55e;}
.red{color:#ef4444;}
.yellow{color:#facc15;}

.sidebar{
  height:100vh;
  background:#020617;
  padding:20px;
  border-right:1px solid #1e293b;
}

.patient-item{
  padding:8px;
  cursor:pointer;
}
.patient-item:hover{
  background:#1e293b;
}
</style>
</head>

<body>

<div class="row">

<!-- Sidebar -->
<div class="col-3 sidebar">
  <h4 class="green">🩺 ICU Monitor</h4>
  <ul id="patients"></ul>
</div>

<!-- Main -->
<div class="col-9 p-3">

<div class="row">

<!-- SYS -->
<div class="col-4">
  <div class="card p-3 text-center">
    <div class="label">SYS</div>
    <div id="sys" class="big-number green">--</div>
  </div>
</div>

<!-- DIA -->
<div class="col-4">
  <div class="card p-3 text-center">
    <div class="label">DIA</div>
    <div id="dia" class="big-number yellow">--</div>
  </div>
</div>

<!-- HR -->
<div class="col-4">
  <div class="card p-3 text-center">
    <div class="label">HR</div>
    <div id="hr" class="big-number red">--</div>
  </div>
</div>

</div>

<!-- Patient info -->
<div class="card p-3 mt-3">
  <h5 id="name">Chưa chọn bệnh nhân</h5>
  <div id="info"></div>
</div>

<!-- Chart -->
<div class="card p-3 mt-3">
  <canvas id="chart"></canvas>
</div>

</div>
</div>

<script>

let currentPatient = null;
let chart;

const socket = io("http://localhost:3000");

// realtime
socket.on("newData", (msg)=>{
  if(!currentPatient) return;
  if(msg.cccd !== currentPatient.cccd) return;

  currentPatient.records.push(msg.data);

  updateDisplay(msg.data);
  drawChart();
});

// update số lớn
function updateDisplay(d){
  document.getElementById("sys").innerText = d.sys;
  document.getElementById("dia").innerText = d.dia;
  document.getElementById("hr").innerText = d.hr;

  // cảnh báo
  if(d.sys > 140 || d.hr > 100){
    alert("⚠️ Cảnh báo huyết áp / nhịp tim cao!");
  }
}

// load bệnh nhân
async function load(){
  let res = await fetch("http://localhost:3000/patient");
  let data = await res.json();

  let list = document.getElementById("patients");
  list.innerHTML = "";

  data.forEach(p=>{
    let li = document.createElement("li");
    li.className="patient-item";
    li.innerText = p.name;
    li.onclick = ()=>selectPatient(p);
    list.appendChild(li);
  });
}

// chọn bệnh nhân
function selectPatient(p){
  currentPatient = p;

  document.getElementById("name").innerText = p.name;
  document.getElementById("info").innerText =
    `CCCD: ${p.cccd} | DOB: ${p.dob}`;

  drawChart();
}

// vẽ chart
function drawChart(){
  let ctx = document.getElementById("chart");

  if(chart) chart.destroy();

  chart = new Chart(ctx,{
    type:"line",
    data:{
      labels: currentPatient.records.map(r=>r.time),
      datasets:[
        {
          label:"SYS",
          data: currentPatient.records.map(r=>r.sys),
          borderColor:"#22c55e"
        },
        {
          label:"DIA",
          data: currentPatient.records.map(r=>r.dia),
          borderColor:"#facc15"
        },
        {
          label:"HR",
          data: currentPatient.records.map(r=>r.hr),
          borderColor:"#ef4444"
        }
      ]
    },
    options:{
      animation:false,
      scales:{
        x:{ticks:{color:"white"}},
        y:{ticks:{color:"white"}}
      },
      plugins:{
        legend:{labels:{color:"white"}}
      }
    }
  });
}

load();

</script>

</body>
</html>
