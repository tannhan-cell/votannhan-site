<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Medical Admin</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;font-family:Segoe UI;background:#eef2f7}
.sidebar{width:220px;background:white;height:100vh;padding:20px;float:left}
.btn{width:100%;padding:12px;margin:10px 0;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
.btn-blue{background:#3b82f6;color:white}
.btn-green{background:#10b981;color:white}
.main{margin-left:240px;padding:20px}
.card{background:white;padding:20px;border-radius:15px;display:inline-block;width:200px;margin:10px;text-align:center}
.value{font-size:40px;font-weight:bold}
.user{background:white;padding:15px;margin:10px;border-radius:10px;cursor:pointer}
</style>

</head>

<body>

<div class="sidebar">
<button class="btn btn-blue" onclick="showDash()">Dashboard</button>
<button class="btn btn-green" onclick="loadUsers()">Users</button>
</div>

<div class="main">

<div id="dash">
<div class="card">SYS<div id="sys" class="value">0</div></div>
<div class="card">DIA<div id="dia" class="value">0</div></div>
<div class="card">HR<div id="hr" class="value">0</div></div>

<canvas id="chart"></canvas>

</div>

<div id="users" style="display:none">
<h2>Users</h2>
<div id="list"></div>
</div>

</div>

<script>

const API = "https://your-server.com";

let chart = new Chart(document.getElementById("chart"),{
  type:"line",
  data:{labels:[],datasets:[{label:"SYS",data:[]}]}
});

function showDash(){
  dash.style.display="block";
  users.style.display="none";
}

function loadUsers(){
  dash.style.display="none";
  users.style.display="block";

  fetch(API+"/api/users")
  .then(r=>r.json())
  .then(data=>{
    list.innerHTML="";
    data.forEach(u=>{
      list.innerHTML+=`<div class="user" onclick="loadUser(${u.id})">${u.name}</div>`;
    });
  });
}

function loadUser(id){
  fetch(API+"/api/data")
  .then(r=>r.json())
  .then(data=>{
    let userData = data.filter(x=>x.user_id==id);

    chart.data.labels=[];
    chart.data.datasets[0].data=[];

    userData.forEach(d=>{
      chart.data.labels.push(d.time);
      chart.data.datasets[0].data.push(d.sys);
    });

    chart.update();
  });
}

// realtime polling
setInterval(()=>{
  fetch(API+"/api/data")
  .then(r=>r.json())
  .then(data=>{
    if(data.length){
      let d = data[data.length-1];

      sys.innerText=d.sys;
      dia.innerText=d.dia;
      hr.innerText=d.hr;
    }
  });
},1000);

</script>

</body>
</html>
