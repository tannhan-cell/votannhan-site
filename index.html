<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Blood Pressure Pro</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
}

.container {
    width: 360px;
    margin: 40px auto;
    background: #1e293b;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

h2 {
    text-align: center;
}

input {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 8px;
    border: none;
    background: #334155;
    color: white;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.save { background: #22c55e; }
.load { background: #3b82f6; }

.records {
    margin-top: 15px;
    max-height: 150px;
    overflow-y: auto;
    background: #0f172a;
    padding: 10px;
    border-radius: 10px;
}

.records div {
    padding: 5px;
    border-bottom: 1px solid #334155;
    cursor: pointer;
}

.preview {
    margin-top: 10px;
    background: #020617;
    padding: 10px;
    border-radius: 10px;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">
    <h2>📊 Huyết Áp</h2>

    <input id="user" placeholder="Tên người dùng">
    <input id="sys" placeholder="SYS">
    <input id="dia" placeholder="DIA">
    <input id="pul" placeholder="PULSE">

    <button class="save" onclick="save()">💾 Lưu</button>
    <button class="load" onclick="load()">📂 Xem</button>

    <div class="records" id="records"></div>
    <div class="preview" id="preview"></div>
</div>

<script>
const API = "http://127.0.0.1:5000";

function save() {
    const data = {
        user: user.value,
        sys: sys.value,
        dia: dia.value,
        pul: pul.value
    };

    fetch(API + "/save", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    })
    .then(res => res.text())
    .then(msg => {
        alert(msg);
        load();
    });
}

function load() {
    fetch(API + "/records/" + user.value)
    .then(res => res.json())
    .then(files => {
        records.innerHTML = "";
        files.forEach(f => {
            const div = document.createElement("div");
            div.innerText = "📄 " + f;
            div.onclick = () => readFile(f);
            records.appendChild(div);
        });
    });
}

function readFile(file) {
    fetch(API + "/records/" + user.value + "/" + file)
    .then(res => res.text())
    .then(text => {
        preview.innerText = text;
    });
}
</script>

</body>
</html>
