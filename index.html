<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
body{margin:0;background:#020617;color:white;font-family:sans-serif}
.sidebar{width:200px;height:100vh;float:left;border-right:1px solid #1e293b}
.sidebar div{padding:10px;color:#94a3b8;cursor:pointer}
.sidebar div:hover{color:#fff}

.main{margin-left:200px;padding:20px}

.card{background:#0f172a;padding:20px;margin-bottom:15px;border-radius:10px}

input{width:100%;padding:10px;margin:5px 0;background:#020617;color:white;border:none}
button{width:100%;padding:10px;background:#16a34a;border:none;color:white}

canvas{background:black;width:100%;height:150px}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" style="padding:100px;text-align:center">
<h2>Admin Login</h2>
<input id="user" placeholder="Username">
<input id="pass" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div id="app" style="display:none">

<div class="sidebar" id="list"></div>

<div class="main">

<div class="card" id="info">Chưa chọn</div>

<div class="card">
SYS <span id="sys">--</span>
DIA <span id="dia">--</span>
HR <span id="hr">--</span>
</div>

<div class="card">
<canvas id="ecg"></canvas>
</div>

<div class="card">
<input id="name" placeholder="Tên">
<input id="dob" placeholder="Ngày sinh">
<input id="cccd" placeholder="CCCD">
<input id="address" placeholder="Địa chỉ">
<button onclick="add()">Tạo</button>
</div>

</div>
</div>

<script>
const API="http://localhost:3000";
let current=null;

// LOGIN FIX
async function login(){
 let res = await fetch(API+"/login",{
  method:"POST",
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({
    username:user.value,
    password:pass.value
  })
 });

 let data=await res.json();

 if(data.success){
   login.style.display="none";
   app.style.display="block";
   load();
 }else alert("Sai tài khoản");
}

// LOAD
async function load(){
 let res=await fetch(API+"/patients");
 let data=await res.json();

 list.innerHTML="";

 data.forEach(p=>{
  let d=document.createElement("div");
  d.innerText=p.name;

  d.onclick=()=>{
    current=p;
    info.innerHTML=`
      <b>${p.name}</b><br>
      ${p.dob}<br>
      ${p.cccd}<br>
      ${p.address}
    `;
  }

  list.appendChild(d);
 });
}

// ADD FIX
async function add(){
 if(!name.value.trim() || !cccd.value.trim()){
   alert("Thiếu!");
   return;
 }

 await fetch(API+"/patient",{
  method:"POST",
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({
    name:name.value.trim(),
    dob:dob.value.trim(),
    cccd:cccd.value.trim(),
    address:address.value.trim()
  })
 });

 load();
}

// ECG
const canvas=document.getElementById("ecg");
const ctx=canvas.getContext("2d");
let x=0;

const socket=io(API);

socket.on("data",(d)=>{
 sys.innerText=d.sys;
 dia.innerText=d.dia;
 hr.innerText=d.hr;

 ctx.fillStyle="black";
 ctx.fillRect(0,0,canvas.width,canvas.height);

 ctx.fillStyle="lime";
 ctx.fillRect(x,75+d.ecg*10,2,2);

 x+=2;
 if(x>canvas.width) x=0;
});
</script>

</body>
</html>
