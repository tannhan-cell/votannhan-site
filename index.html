<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{background:#020617;color:white;font-family:sans-serif;margin:0}
.sidebar{width:220px;float:left;height:100vh;background:#020617;border-right:1px solid #333}
.item{padding:10px;cursor:pointer}
.item:hover{background:#1e293b}
.main{margin-left:220px;padding:20px}
.card{background:#0f172a;padding:15px;margin-bottom:10px;border-radius:10px}
button{background:red;color:white;border:none;padding:5px;border-radius:5px}
</style>
</head>

<body>

<div class="sidebar" id="list"></div>

<div class="main">
<div class="card" id="info">Chọn bệnh nhân</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

<div class="card">
<input id="name" placeholder="Tên">
<input id="cccd" placeholder="CCCD">
<button onclick="add()">Tạo</button>
</div>
</div>

<script>
const API="http://127.0.0.1:3000";
let current="";
let chart;

async function load(){
 let res=await fetch(API+"/patients");
 let data=await res.json();

 list.innerHTML="";
 data.forEach(p=>{
  let div=document.createElement("div");
  div.className="item";
  div.innerHTML=p+` <button onclick="del('${p}')">X</button>`;

  div.onclick=()=>{
    current=p;
    info.innerText=p;
    loadRecords();
  };

  list.appendChild(div);
 });
}

async function add(){
 let name=nameInput.value;
 let cccd=cccdInput.value;

 await fetch(API+"/patient",{
  method:"POST",
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({name,cccd})
 });

 load();
}

async function del(n){
 await fetch(API+"/delete/"+n);
 load();
}

async function loadRecords(){
 let res=await fetch(API+"/records/"+current);
 let files=await res.json();

 let labels=[];
 let sys=[],dia=[],hr=[];

 files.forEach(f=>{
  labels.push(f);
  sys.push(Math.random()*30+110);
  dia.push(Math.random()*20+70);
  hr.push(Math.random()*40+60);
 });

 drawChart(labels,sys,dia,hr);
}

function drawChart(labels,sys,dia,hr){
 if(chart) chart.destroy();

 chart=new Chart(document.getElementById("chart"),{
  type:"line",
  data:{
    labels:labels,
    datasets:[
      {label:"SYS",data:sys,borderColor:"lime"},
      {label:"DIA",data:dia,borderColor:"yellow"},
      {label:"HR",data:hr,borderColor:"red"}
    ]
  }
 });
}

// realtime + auto save
const socket=io(API);
socket.on("data",(d)=>{
 if(current){
   fetch(API+"/save",{
     method:"POST",
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify({...d,folder:current})
   });
 }
});

load();
</script>

</body>
</html>
