<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Quản lý huyết áp</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial;
    display: flex;
    margin: 0;
}

#left {
    width: 25%;
    background: #2c3e50;
    color: white;
    padding: 10px;
}

#right {
    flex: 1;
    padding: 20px;
}

button {
    padding: 5px 10px;
    margin: 5px;
}

input {
    width: 90%;
    margin: 5px;
    padding: 5px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div id="left">
    <h3>Bệnh nhân</h3>
    <div id="list"></div>
</div>

<!-- MAIN -->
<div id="right">
    <h2>Tạo hồ sơ</h2>

    <input id="name" placeholder="Tên"><br>
    <input id="dob" placeholder="Ngày sinh"><br>
    <input id="cccd" placeholder="CCCD"><br>
    <input id="addr" placeholder="Địa chỉ"><br>

    <button onclick="create()">Tạo</button>

    <h2>Biểu đồ</h2>
    <canvas id="chart"></canvas>
</div>

<script>
let currentFolder = null
let chart = null

function create(){
    fetch("http://127.0.0.1:5000/create_patient",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            name: name.value,
            dob: dob.value,
            cccd: cccd.value,
            addr: addr.value
        })
    }).then(()=>load())
}

function load(){
    fetch("http://127.0.0.1:5000/patients")
    .then(r=>r.json())
    .then(data=>{
        list.innerHTML=""
        data.forEach(f=>{
            let div=document.createElement("div")
            div.innerHTML=f
            div.onclick=()=>openFolder(f)
            list.appendChild(div)
        })
    })
}

function openFolder(folder){
    currentFolder = folder

    fetch("http://127.0.0.1:5000/records/"+folder)
    .then(r=>r.json())
    .then(data=>{
        let labels = data.map(x=>x.time)
        let sys = data.map(x=>x.sys)
        let dia = data.map(x=>x.dia)
        let pulse = data.map(x=>x.pulse)

        if(chart) chart.destroy()

        chart = new Chart(document.getElementById("chart"),{
            type:"line",
            data:{
                labels:labels,
                datasets:[
                    {label:"SYS", data:sys, borderColor:"red"},
                    {label:"DIA", data:dia, borderColor:"blue"},
                    {label:"PULSE", data:pulse, borderColor:"green"}
                ]
            }
        })
    })
}

load()
</script>

</body>
</html>
