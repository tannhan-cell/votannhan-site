<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Medical Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;font-family:Segoe UI;background:#eef3f8}
.header{background:#2563eb;color:white;padding:15px;font-size:22px}
.card{background:white;padding:20px;border-radius:15px;margin:10px;display:inline-block;width:180px;text-align:center}
.value{font-size:35px;font-weight:bold}
.popup{position:fixed;top:20px;right:20px;background:red;color:white;padding:15px;border-radius:10px;display:none}
</style>

</head>

<body>

<div class="header">🏥 Smart Blood Pressure System</div>

<div>
<div class="card">SYS<div id="sys" class="value">0</div></div>
<div class="card">DIA<div id="dia" class="value">0</div></div>
<div class="card">HR<div id="hr" class="value">0</div></div>
</div>

<canvas id="chart"></canvas>

<div id="alert" class="popup"></div>

<script>

const API="https://doanvdk.onrender.com";

let chart=new Chart(document.getElementById("chart"),{
 type:"line",
 data:{labels:[],datasets:[{label:"SYS",data:[]}]}
});

setInterval(()=>{
 fetch(API+"/api/data")
 .then(r=>r.json())
 .then(data=>{
  if(data.length){
    let d=data[data.length-1];

    sys.innerText=d[0];
    dia.innerText=d[1];
    hr.innerText=d[2];

    chart.data.labels.push(new Date().toLocaleTimeString());
    chart.data.datasets[0].data.push(d[0]);

    if(chart.data.labels.length>20){
      chart.data.labels.shift();
      chart.data.datasets[0].data.shift();
    }

    chart.update();

    if(d[0]>140){
      alert.innerText="⚠️ HUYẾT ÁP CAO!";
      alert.style.display="block";
      setTimeout(()=>alert.style.display="none",3000);
    }
  }
 });
},1000);

</script>

</body>
</html>
