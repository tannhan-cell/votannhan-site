<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ICU Monitor</title>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
body {background:#0b1220;color:white;font-family:Arial;}
.card {background:#111827;padding:15px;margin:10px;border-radius:10px;}
.big {font-size:40px;font-weight:bold;}
button {padding:10px;margin:5px;}
</style>
</head>

<body>

<h2>🏥 ICU Dashboard</h2>

<div class="card">
  <h3>Tạo bệnh nhân</h3>
  <input id="name" placeholder="Tên"><br>
  <input id="cccd" placeholder="CCCD"><br>
  <input id="dob" placeholder="DOB"><br>
  <input id="address" placeholder="Address"><br>
  <button onclick="add()">Tạo</button>
</div>

<div class="card">
  <h3>Danh sách</h3>
  <ul id="list"></ul>
</div>

<div class="card">
  <h3 id="pname">---</h3>
  <button onclick="fake()">ĐO THỬ</button>
</div>

<div class="card">
  SYS <div id="sys" class="big">--</div>
  DIA <div id="dia" class="big">--</div>
  HR <div id="hr" class="big">--</div>
</div>

<script>

const API = "http://127.0.0.1:5000";
const socket = io(API);

let current = null;

// load
async function load(){
  let res = await fetch(API+"/patients");
  let data = await res.json();

  list.innerHTML="";
  data.forEach(p=>{
    let li=document.createElement("li");
    li.innerText=p.name;
    li.onclick=()=>select(p);
    list.appendChild(li);
  });
}

// tạo
async function add(){
  await fetch(API+"/create_patient",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      name:name.value,
      cccd:cccd.value,
      dob:dob.value,
      address:address.value
    })
  });
  load();
}

// chọn
function select(p){
  current=p;
  pname.innerText=p.name;
}

// fake data
async function fake(){
  if(!current) return alert("chọn bệnh nhân");

  await fetch(API+"/record/"+current.cccd,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      sys:120+Math.random()*20,
      dia:80+Math.random()*10,
      hr:70+Math.random()*20
    })
  });
}

// realtime
socket.on("newData",(msg)=>{
  if(!current) return;
  if(msg.cccd!==current.cccd) return;

  sys.innerText=Math.round(msg.data.sys);
  dia.innerText=Math.round(msg.data.dia);
  hr.innerText=Math.round(msg.data.hr);
});

load();

</script>

</body>
</html>
